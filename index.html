<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exalted Lion Games privacy policies</title>
<meta name="description" content="Privacy policies for the games made by Exalted Lion Games.">
<style>
:root {
  color-scheme: light dark;
  --bg: #FFF9F2; --card: #FFFFFF; --ink: #2A2238; --soft: #6B6385; --link: #17784F; --line: rgba(42, 34, 56, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17142B; --card: #231C3E; --ink: #F3EEFF; --soft: #B9B1D6; --link: #9CF6C8; --line: rgba(255, 255, 255, 0.10); }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 40px 20px 56px; }
header { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
header img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 6px 18px rgba(23, 20, 43, 0.25); }
h1 { font-size: 28px; line-height: 1.2; margin: 0; }
.meta { color: var(--soft); margin: 4px 0 0; font-size: 15px; }
article, .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
article { padding: 6px 28px 20px; }
h2 { font-size: 20px; line-height: 1.3; margin: 26px 0 8px; }
p, li { margin: 0 0 12px; }
ul { padding-left: 22px; }
a { color: var(--link); }
.card { display: flex; align-items: center; gap: 16px; padding: 16px; text-decoration: none; color: inherit; }
.card img { width: 56px; height: 56px; border-radius: 14px; }
.card strong { display: block; font-size: 19px; }
.card span { color: var(--soft); font-size: 15px; }
footer { color: var(--soft); font-size: 14px; text-align: center; margin-top: 28px; }
@media (max-width: 480px) { article { padding: 2px 18px 16px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
<header>
<div><h1>Exalted Lion Games</h1><p class="meta">Privacy policies</p></div>
</header>
<a class="card" href="tangle-glass/privacy-policy.html">
<img src="tangle-glass/icon.png" alt="">
<div><strong>Tangle Glass</strong><span>Privacy policy</span></div>
</a>
<footer>Questions: <a href="mailto:exaltedliongame@gmail.com">exaltedliongame@gmail.com</a></footer>
</main>
</body>
</html>
